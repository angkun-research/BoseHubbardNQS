name: Python and Julia tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'pythonTest/**'
      - 'test/**'
      - 'tests/**'
      - 'example/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'docs/requirements-ci.txt'
      - '.github/workflows/tests.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pythonTest/**'
      - 'test/**'
      - 'tests/**'
      - 'example/**'
      - 'Project.toml'
      - 'Manifest.toml'
      - 'docs/requirements-ci.txt'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLCONFIGDIR: /tmp/bhnqs-ci-mpl
      PYTHONDONTWRITEBYTECODE: '1'
      JULIA_CONDAPKG_BACKEND: 'Null'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: docs/requirements-ci.txt
      - name: Install the tested CPU runtime
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r docs/requirements-ci.txt
          echo "JULIA_PYTHONCALL_EXE=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.13'
      - uses: julia-actions/cache@v3
      - name: Instantiate the Julia project
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - name: Python 1D regression checks
        run: python -B pythonTest/vmc_gpu_test.py --self-test --device cpu
      - name: Python 2D regression checks
        run: python -B -m unittest discover -s pythonTest/2D/tests
      - name: Python bridge and namespace checks
        run: python -B -m unittest discover -s tests
      - name: Julia end-to-end bridge checks
        run: julia --project=. test/runtests.jl
